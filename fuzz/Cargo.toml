[package]
name = "ec-fuzz"
description = "Fuzz targets for every parser that reads data from the network or the user."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ec-core = { path = "../crates/ec-core" }
ec-net = { path = "../crates/ec-net" }
ec-transfer = { path = "../crates/ec-transfer" }
ec-sync = { path = "../crates/ec-sync" }

# Kept out of the main workspace: it needs a nightly toolchain.
[workspace]

[[bin]]
name = "invite"
path = "fuzz_targets/invite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_message"
path = "fuzz_targets/control_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rel_path"
path = "fuzz_targets/rel_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_message"
path = "fuzz_targets/sync_message.rs"
test = false
doc = false
bench = false
