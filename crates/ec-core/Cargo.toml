[package]
name = "ec-core"
description = "Device identity, pairing and the trust store of paired devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
hex = "0.4.3"
rand = "0.10.3"
rcgen = { version = "0.14.7", default-features = false, features = ["ring", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
