[package]
# Underscore, not dash: cargokit derives the library file name from the package name.
name = "ec_ffi"
description = "Flutter bindings for the ECOnnector runtime (flutter_rust_bridge)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0.104"
ec-core = { version = "0.0.1", path = "../ec-core" }
ec-fling = { version = "0.0.1", path = "../ec-fling" }
ec-net = { version = "0.0.1", path = "../ec-net" }
ec-runtime = { version = "0.0.1", path = "../ec-runtime" }
ec-transfer = { version = "0.0.1", path = "../ec-transfer" }
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time"] }

# Not the workspace lints: the generated bridge code needs `unsafe`, which the
# workspace forbids. Unsafe stays confined to the generated module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
