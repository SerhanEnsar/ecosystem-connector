[package]
name = "ec-transfer"
description = "Chunked, parallel and resumable file transfer with BLAKE3 integrity checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
ec-core = { version = "0.0.1", path = "../ec-core" }
ec-net = { version = "0.0.1", path = "../ec-net" }
hex = "0.4.3"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
