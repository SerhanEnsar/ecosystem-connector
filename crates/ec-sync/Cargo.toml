[package]
name = "ec-sync"
description = "Linked files: one logical file kept current on every paired device, with history and conflict handling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ec-core = { version = "0.0.1", path = "../ec-core" }
ec-net = { version = "0.0.1", path = "../ec-net" }
ec-transfer = { version = "0.0.1", path = "../ec-transfer" }
hex = "0.4.3"
notify = "8.2.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
