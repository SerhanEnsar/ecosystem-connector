[package]
name = "ec-fling"
description = "Flinging a web page (and later other small items) to another device, which offers to open it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ec-core = { version = "0.0.1", path = "../ec-core" }
ec-net = { version = "0.0.1", path = "../ec-net" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
