[package]
name = "ec-net"
description = "Local network discovery (mDNS) and the encrypted QUIC transport between paired devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
ec-core = { version = "0.0.1", path = "../ec-core" }
hex = "0.4.3"
if-addrs = "0.15.0"
mdns-sd = "0.21.5"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
