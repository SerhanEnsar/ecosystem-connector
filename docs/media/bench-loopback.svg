<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--series:#2a78d6}
@media (prefers-color-scheme: dark){:root{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--series:#3987e5}}
text{fill:var(--ink2);font-size:12px}.title{fill:var(--ink);font-size:15px;font-weight:600}
.value{fill:var(--ink);font-size:12px;font-weight:600}
</style>
<title id="t">Loopback transfer speed by parallel streams</title>
<desc id="d">Median MB/s over 5 runs of a 1 GiB file, Apple M4, macOS 27, commit 21990a2.</desc>
<rect width="640" height="360" rx="8" fill="var(--surface)"/>
<text class="title" x="64" y="28">Transfer speed on loopback (MB/s, median)</text>
<text x="64" y="48">1 GiB file, QUIC + TLS 1.3 + BLAKE3 + disk writes · Apple M4, macOS 27 · commit 21990a2</text>
<line x1="64" x2="616" y1="304.0" y2="304.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="308.0" text-anchor="end">0</text>
<line x1="64" x2="616" y1="226.7" y2="226.7" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="230.7" text-anchor="end">100</text>
<line x1="64" x2="616" y1="149.3" y2="149.3" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="153.3" text-anchor="end">200</text>
<line x1="64" x2="616" y1="72.0" y2="72.0" stroke="var(--grid)" stroke-width="1"/>
<text x="56" y="76.0" text-anchor="end">300</text>
<path d="M107.2,304.0 V170.5 Q107.2,166.5 111.2,166.5 H127.2 Q131.2,166.5 131.2,170.5 V304.0 Z" fill="var(--series)"><title>1 streams: median 178 MB/s (min 96, max 210, 5 runs)</title></path>
<line x1="139.2" x2="139.2" y1="229.9" y2="141.4" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/>
<text class="value" x="119.2" y="158.5" text-anchor="middle">178</text>
<text x="119.2" y="324.0" text-anchor="middle">1</text>
<path d="M217.6,304.0 V144.6 Q217.6,140.6 221.6,140.6 H237.6 Q241.6,140.6 241.6,144.6 V304.0 Z" fill="var(--series)"><title>2 streams: median 211 MB/s (min 154, max 264, 5 runs)</title></path>
<line x1="249.6" x2="249.6" y1="185.2" y2="99.5" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/>
<text class="value" x="229.6" y="132.6" text-anchor="middle">211</text>
<text x="229.6" y="324.0" text-anchor="middle">2</text>
<path d="M328.0,304.0 V122.6 Q328.0,118.6 332.0,118.6 H348.0 Q352.0,118.6 352.0,122.6 V304.0 Z" fill="var(--series)"><title>4 streams: median 240 MB/s (min 235, max 252, 5 runs)</title></path>
<line x1="360.0" x2="360.0" y1="122.4" y2="109.4" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/>
<text class="value" x="340.0" y="110.6" text-anchor="middle">240</text>
<text x="340.0" y="324.0" text-anchor="middle">4</text>
<path d="M438.4,304.0 V164.4 Q438.4,160.4 442.4,160.4 H458.4 Q462.4,160.4 462.4,164.4 V304.0 Z" fill="var(--series)"><title>8 streams: median 186 MB/s (min 156, max 225, 5 runs)</title></path>
<line x1="470.4" x2="470.4" y1="183.4" y2="130.2" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/>
<text class="value" x="450.4" y="152.4" text-anchor="middle">186</text>
<text x="450.4" y="324.0" text-anchor="middle">8</text>
<path d="M548.8,304.0 V122.9 Q548.8,118.9 552.8,118.9 H568.8 Q572.8,118.9 572.8,122.9 V304.0 Z" fill="var(--series)"><title>16 streams: median 239 MB/s (min 186, max 252, 5 runs)</title></path>
<line x1="580.8" x2="580.8" y1="159.9" y2="109.5" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round"/>
<text class="value" x="560.8" y="110.9" text-anchor="middle">239</text>
<text x="560.8" y="324.0" text-anchor="middle">16</text>
<text x="340.0" y="348" text-anchor="middle">parallel chunk streams · thin line: slowest to fastest run</text>
</svg>
