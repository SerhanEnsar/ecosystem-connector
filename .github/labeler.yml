"area: core":
  - changed-files:
      - any-glob-to-any-file: ["crates/**", "Cargo.toml", "Cargo.lock"]
"area: ui":
  - changed-files:
      - any-glob-to-any-file: ["packages/**"]
"platform: android":
  - changed-files:
      - any-glob-to-any-file: ["apps/android/**"]
"platform: macos":
  - changed-files:
      - any-glob-to-any-file: ["apps/macos/**"]
"platform: windows":
  - changed-files:
      - any-glob-to-any-file: ["apps/windows/**"]
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "tools/**"]
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
