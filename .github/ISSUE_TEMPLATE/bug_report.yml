name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issues must not be reported here**; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pair a Mac and an Android phone
        2. Send a 2 GB file
        3. ...
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms involved
      multiple: true
      options:
        - Android
        - macOS
        - Windows
        - Command line (ec)
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices and OS versions
      placeholder: "macOS 15.2 (M2) → Android 15 (Galaxy Tab S9)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove file names or anything private before pasting.
      render: text
