# Windows app: apps/windows plus the shared UI package it depends on.
name: Windows

on:
  push:
    branches: [main, develop, "platform/**"]
    paths:
      - "apps/windows/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "packages/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  app:
    name: Analyze, test and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze packages/ec_ui apps/windows
      - run: flutter test
        working-directory: packages/ec_ui
      - run: flutter test
        working-directory: apps/windows
      - run: flutter build windows --debug
        working-directory: apps/windows
