# Builds every platform from a version tag and publishes a GitHub release.
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Tags with a suffix (v0.1.0-alpha.1) become pre-releases. Every file gets a SHA-256
# checksum and a signed build provenance attestation, so users can verify that it was
# built here from this repository:  gh attestation verify <file> -R SerhanEnsar/ecosystem-connector
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    # Signing secrets live in this environment, which only v* tags may use.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Run tools/android/setup-release-signing.sh"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.p12" >> "$GITHUB_ENV"
      - name: Build signed APKs
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          args=(--release --build-name "$version" --build-number "$GITHUB_RUN_NUMBER")
          flutter build apk "${args[@]}"
          # Same versionCode for every ABI, so any APK can update any other.
          flutter build apk "${args[@]}" --split-per-abi -P force-version-code-ignoring-abi=true
          out=build/app/outputs/flutter-apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$out/app-release.apk" "$GITHUB_WORKSPACE/dist/ECOnnector-$version-android-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "$GITHUB_WORKSPACE/dist/ECOnnector-$version-android-$abi.apk"
          done
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/macos
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build macos --release --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/ECOnnector.app" \
            "$GITHUB_WORKSPACE/dist/ECOnnector-$version-macos-universal.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/windows
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          flutter build windows --release --build-name $version --build-number $env:GITHUB_RUN_NUMBER
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/dist/ECOnnector-$version-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  cli:
    name: ec CLI (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, bin: ec }
          - { name: linux-x64, os: ubuntu-latest, bin: ec }
          - { name: windows-x64, os: windows-latest, bin: ec.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked -p ec-cli
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="ECOnnector-$version-command-line-${{ matrix.name }}"
          mkdir -p "$name" dist
          cp "target/release/${{ matrix.bin }}" LICENSE NOTICE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$name.zip" "$name" >/dev/null
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, macos, windows, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          sed "s/{{VERSION}}/$version/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ECOnnector $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "${flags[@]}"
