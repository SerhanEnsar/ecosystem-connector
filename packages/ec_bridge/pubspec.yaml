name: ec_bridge
description: Dart bindings for the Rust core of ECOnnector (flutter_rust_bridge + cargokit).
publish_to: none
version: 0.0.1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
